<h1>App Version: {{ '1.0.1' }}</h1>
@if (showNav()) {
  <header class="border-b border-arena-line/80 bg-arena-navy/70 backdrop-blur">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-2 px-4 py-2">
      <a [routerLink]="auth.isAdmin() ? '/admin' : '/'" class="font-display text-base font-semibold text-white">
        Ludo Arena
      </a>
      <nav class="flex flex-wrap items-center gap-3 text-sm text-arena-mist/80">
        @if (auth.user(); as user) {
          @if (auth.isAdmin()) {
            <a routerLink="/admin" class="hover:text-arena-gold">Dashboard</a>
            <a routerLink="/admin/users" class="hover:text-arena-gold">Users</a>
            <a routerLink="/admin/tournaments" class="hover:text-arena-gold">Tournaments</a>
            <a routerLink="/broadcast" class="hover:text-arena-gold">Broadcast</a>
            <a routerLink="/local" class="hover:text-arena-gold">Hot-seat</a>
          } @else {
            <a routerLink="/" class="hover:text-arena-gold">Invitations</a>
            <a routerLink="/broadcast" class="hover:text-arena-gold">Live broadcast</a>
            <a routerLink="/local" class="hover:text-arena-gold">Hot-seat</a>
            <a routerLink="/profile" class="hover:text-arena-gold">Profile</a>
          }
          <a routerLink="/profile" class="text-arena-mist/50 hover:text-arena-gold">{{ user.name }}</a>
          <button type="button" class="hover:text-piece-red" (click)="auth.logout()">Sign out</button>
        } @else {
          <a routerLink="/local" class="hover:text-arena-gold">Hot-seat</a>
          <a routerLink="/broadcast" class="hover:text-arena-gold">Live broadcast</a>
          <a routerLink="/login" class="hover:text-arena-gold">Sign in</a>
          <a routerLink="/register" class="hover:text-arena-gold">Register</a>
        }
      </nav>
    </div>
  </header>
}
<router-outlet />
